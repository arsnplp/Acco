# Configuration nginx proposée pour acco-lab.fr
# NON APPLIQUÉE : à valider avant toute modification sur le VPS.
#
# Mise en place (une fois validée) :
#   1. Ouvrir le vhost actuel : sudo nano /etc/nginx/sites-available/acco-lab.fr
#      (ou /etc/nginx/sites-enabled/default selon l'installation)
#   2. Dans le bloc server { ... } qui sert le site, ajouter les blocs ci-dessous
#      (remplacer le "location / { try_files ... /index.html; }" existant, qui est
#      la cause du 200 renvoyé pour les fichiers inexistants).
#   3. sudo nginx -t   (vérifie la syntaxe)
#   4. sudo systemctl reload nginx
#   5. Vérifier : curl -I https://acco-lab.fr/nexistepas  -> HTTP/2 404
#                 curl -I https://acco-lab.fr/image/sit.webp -> cache-control: public, max-age=31536000, immutable

server {
    # ... lignes existantes (listen, server_name, ssl_certificate, root, index) inchangées ...
    # root /var/www/acco-lab.fr;   <- garder la valeur actuelle

    # Page 404 réelle, avec le bon code de statut
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Images, polices, icônes : cache 1 an (les fichiers changent de nom ou sont
    # remplacés rarement ; pour forcer un rafraîchissement, renommer le fichier)
    location ~* \.(webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # CSS, JS, manifest : cache 1 an
    location ~* \.(css|js|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML : pas de cache long, revalidation à chaque visite (ETag/Last-Modified
    # restent actifs, le navigateur reçoit un 304 si la page n'a pas changé)
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        # Plus de repli vers /index.html : une URL inconnue renvoie maintenant un vrai 404
        try_files $uri $uri/ $uri.html =404;
    }

    # Compression (si pas déjà activée dans nginx.conf)
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
